<!doctype html>
<html lang="en" class="bg-bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Full stack engineer building production web applications with React, Node.js, TypeScript and MongoDB. Open to remote and relocation roles across Southeast Asia."
    />

    <!-- Preconnect to font origins early so the TLS handshake overlaps
         with the rest of page parsing instead of blocking on it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the hero photo so it starts downloading immediately
         instead of waiting for React to mount and discover the <img>.
         IMPORTANT: keep this href in sync with the <img src> in Hero.tsx ProfileFrame. -->
    <link rel="preload" as="image" href="/profile.webp" fetchpriority="high" />

    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />

    <title>NORAIZ RANA — Full Stack Engineer</title>

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Noraiz Rana — Full Stack Engineer" />
    <meta
      property="og:description"
      content="Full stack engineer building production web applications with React, Node.js, TypeScript and MongoDB. Open to remote and relocation roles across Southeast Asia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noraizrana-portfolio.vercel.app/" />
    <meta property="og:image" content="https://noraizrana-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Noraiz Rana — Full Stack Engineer" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noraiz Rana — Full Stack Engineer" />
    <meta name="twitter:description" content="Full stack engineer building production web applications with React, Node.js, TypeScript and MongoDB. Open to remote and relocation roles across Southeast Asia." />
    <meta name="twitter:image" content="https://noraizrana-portfolio.vercel.app/og.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://noraizrana-portfolio.vercel.app/" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Noraiz Rana",
      "jobTitle": "Full Stack Engineer",
      "url": "https://noraizrana-portfolio.vercel.app/",
      "sameAs": ["https://github.com/noraizrana"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Sargodha",
        "addressCountry": "PK"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
